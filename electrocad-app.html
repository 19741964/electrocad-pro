const PROMPT_AMBIENTE = `Sos un electricista matriculado experto en normativa AEA 90364 argentina.
Analizá esta foto de un ambiente/habitación y respondé SOLO con JSON válido, sin texto extra, sin backticks:
{"tipo_ambiente":"string","dimensiones_estimadas":{"largo_m":0,"ancho_m":0,"alto_m":0},"superficie_m2":0,"observaciones_zona":"string","circuitos_recomendados":[{"nombre":"string","tipo":"iluminacion|tomas|especial","amp_termica":0,"seccion_cable_mm2":0}],"bocas_recomendadas":[{"tipo":"tomacorriente|luz|interruptor|toma_especial","cantidad":0,"ubicacion_sugerida":"string","normativa":"string"}],"tablero":{"modulos_necesarios":0,"carga_total_estimada_w":0,"corriente_total_a":0},"alertas":["string"],"materiales_estimados":[{"item":"string","cantidad":0,"unidad":"string","precio_estimado_ars":0}],"cumplimiento_aea":{"ok":true,"observaciones":"string"}}`;

const PROMPT_PLANO = `Sos un electricista matriculado experto en normativa AEA 90364 argentina.
Analizá este plano arquitectónico y respondé SOLO con JSON válido, sin texto extra, sin backticks:
{"tipo_edificacion":"string","ambientes_detectados":[{"nombre":"string","superficie_m2":0,"circuitos":[{"nombre":"string","tipo":"string","amp_termica":0,"seccion_mm2":0}],"bocas":[{"tipo":"string","cantidad":0}]}],"superficie_total_m2":0,"resumen_tablero":{"circuitos_totales":0,"modulos_din":0,"corriente_total_a":0,"potencia_total_kw":0,"diferencial_recomendado_a":0,"medidor_recomendado":"string"},"cableado_total":{"cable_15mm2_m":0,"cable_25mm2_m":0,"cable_4mm2_m":0,"caneria_corrugada_m":0},"alertas_normativa":["string"],"presupuesto_materiales":[{"item":"string","cantidad":0,"unidad":"string","precio_estimado_ars":0}],"total_estimado_ars":0,"cumplimiento_aea":{"porcentaje":0,"observaciones":"string"}}`;

async function analizarConClaude(imageBase64, mediaType, modo) {
  const prompt = modo === "ambiente" ? PROMPT_AMBIENTE : PROMPT_PLANO;
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514", max_tokens: 1000,
      messages: [{ role: "user", content: [
        { type: "image", source: { type: "base64", media_type: mediaType, data: imageBase64 } },
        { type: "text", text: prompt }
      ]}]
    })
  });
  if (!response.ok) throw new Error(`API Error: ${response.status}`);
  const data = await response.json();
  const raw = data.content.map(b => b.text || "").join("");
  return JSON.parse(raw.replace(/```json|```/g, "").trim());
}

function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(",")[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

// ── SHARED UI ────────────────────────────────────────────────
function IaTag({ children, color = DS.blue }) {
  return <span style={{ background:`${color}22`, color, border:`1px solid ${color}44`,
    padding:"2px 8px", borderRadius:3, fontSize:10, fontWeight:700, letterSpacing:0.5 }}>{children}</span>;
}
function StatBox({ label, value, color = DS.accent, unit = "" }) {
  return (
    <div style={{ background:DS.surface, border:`1px solid ${DS.border}`, borderRadius:8, padding:"14px 16px" }}>
      <div style={{ fontSize:10, color:DS.muted, letterSpacing:2, marginBottom:6, fontWeight:600 }}>{label}</div>
      <div style={{ fontFamily:DS.mono, fontSize:24, fontWeight:700, color }}>{value}<span style={{ fontSize:12, color:DS.muted, marginLeft:4 }}>{unit}</span></div>
    </div>
  );
}
function IaAlert({ msg, type="warn" }) {
  const colors = { warn:DS.yellow, err:DS.red, ok:DS.green, info:DS.blue };
  const icons  = { warn:"⚠", err:"✕", ok:"✓", info:"ℹ" };
  const c = colors[type];
  return (
    <div style={{ background:`${c}11`, border:`1px solid ${c}33`, borderRadius:6,
      padding:"10px 14px", display:"flex", gap:10, alignItems:"flex-start", marginBottom:8 }}>
      <span style={{ color:c, fontWeight:700, flexShrink:0 }}>{icons[type]}</span>
      <span style={{ fontSize:13, color:DS.text }}>{msg}</span>
    </div>
  );
}

function UploadZone({ onFile, modo }) {
  const ref = useRef();
  const [drag, setDrag] = useState(false);
  const handleDrop = useCallback(e => { e.preventDefault(); setDrag(false); const f=e.dataTransfer.files[0]; if(f&&f.type.startsWith("image/")) onFile(f); }, [onFile]);
  return (
    <div onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)}
      onDrop={handleDrop} onClick={()=>ref.current.click()}
      style={{ border:`2px dashed ${drag?DS.accent:DS.border}`, borderRadius:12, padding:"36px 20px",
        textAlign:"center", cursor:"pointer", background:drag?`${DS.accent}08`:"transparent", transition:"all 0.2s" }}>
      <input ref={ref} type="file" accept="image/*" style={{ display:"none" }} onChange={e=>e.target.files[0]&&onFile(e.target.files[0])} />
      <div style={{ fontSize:36, marginBottom:10 }}>{modo==="ambiente"?"📷":"📐"}</div>
      <div style={{ fontSize:16, fontWeight:700, marginBottom:6 }}>{modo==="ambiente"?"Foto del Ambiente":"Foto del Plano Arquitectónico"}</div>
      <div style={{ fontSize:12, color:DS.muted, marginBottom:14 }}>{modo==="ambiente"?"Sacá una foto del cuarto o espacio a electrificar":"Subí una foto del plano (papel o digital)"}</div>

      <div style={{ fontSize:9, color:DS.muted, marginTop:8 }}>JPG · PNG · WEBP · Máx. 10 MB</div>
    </div>
  );
}

// ── MÓDULO IA COMPLETO ───────────────────────────────────────
function ModuloIA() {
  const [modo, setModo] = useState("ambiente");
  const [file, setFile] = useState(null);
  const [preview, setPreview] = useState(null);
  const [loading, setLoading] = useState(false);
  const [progress, setProgress] = useState("");
  const [resultado, setResultado] = useState(null);
  const [error, setError] = useState(null);

  const handleFile = useCallback(f => {
    setFile(f); setResultado(null); setError(null);
    setPreview(URL.createObjectURL(f));
  }, []);

  const analizar = async () => {
    if (!file) return;
    setLoading(true); setError(null); setResultado(null);
    try {
      const steps = modo==="ambiente"
        ? ["Procesando imagen...","Detectando ambiente...","Calculando bocas y circuitos...","Estimando materiales..."]
        : ["Procesando plano...","Detectando ambientes...","Calculando circuitos...","Generando presupuesto..."];
      for (let i=0; i<steps.length; i++) { setProgress(steps[i]); await new Promise(r=>setTimeout(r,600)); }
      const base64 = await fileToBase64(file);
      const data = await analizarConClaude(base64, file.type, modo);
      setResultado(data);
    } catch(e) {
      setError(`Error: ${e.message}. Verificá que la imagen sea clara.`);
    } finally { setLoading(false); setProgress(""); }
  };

  const reset = () => { setFile(null); setPreview(null); setResultado(null); setError(null); };

  return (
    <div>
      {/* Modo tabs */}
      <div style={{ display:"flex", gap:0, marginBottom:16, background:DS.panel,
        border:`1px solid ${DS.border}`, borderRadius:8, padding:4 }}>
        {[{id:"ambiente",label:"📷 Foto de Ambiente"},{id:"plano",label:"📐 Foto de Plano"}].map(m => (
          <div key={m.id} onClick={()=>{setModo(m.id);reset();}}
            style={{ flex:1, padding:"9px 16px", borderRadius:6, cursor:"pointer", textAlign:"center",
              fontSize:13, fontWeight:700, letterSpacing:0.5, transition:"all 0.2s",
              background:modo===m.id?DS.accent:"transparent", color:modo===m.id?"#000":DS.muted }}>
            {m.label}
          </div>
        ))}
      </div>
      <IaAlert type="info" msg={modo==="ambiente"
        ? "La IA detecta el tipo de espacio, estima dimensiones y calcula automáticamente bocas, circuitos, materiales y costos según AEA 90364."
        : "La IA interpreta el plano, detecta todos los ambientes, calcula el cómputo eléctrico completo y genera presupuesto de materiales."} />

      {!resultado && (
        <div style={{ marginTop:14 }}>
          {!preview ? <UploadZone onFile={handleFile} modo={modo} /> : (
            <div style={{ background:DS.panel, border:`1px solid ${DS.border}`, borderRadius:10, overflow:"hidden" }}>
              <div style={{ position:"relative" }}>
                <img src={preview} alt="" style={{ width:"100%", maxHeight:360, objectFit:"contain", background:DS.surface, display:"block" }} />
                <div style={{ position:"absolute", top:10, right:10 }}>
                  <button onClick={reset} style={{ padding:"6px 14px", background:"rgba(0,0,0,0.7)",
                    border:`1px solid ${DS.border}`, color:DS.muted, borderRadius:5, cursor:"pointer",
                    fontFamily:DS.font, fontSize:12 }}>✕ Cambiar</button>
                </div>
              </div>
              <div style={{ padding:14 }}>
                <button onClick={analizar} disabled={loading} style={{ width:"100%", padding:13,
                  borderRadius:8, border:"none", fontFamily:DS.font, fontSize:15, fontWeight:700,
                  letterSpacing:1, cursor:loading?"not-allowed":"pointer",
                  background:loading?DS.border:`linear-gradient(135deg,${DS.accent},${DS.accentDim})`,
                  color:loading?DS.muted:"#000", display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}>
                  {loading ? "Analizando..." : `⚡ Analizar con IA — ${modo==="ambiente"?"Calcular circuitos":"Calcular instalación completa"}`}
                </button>
              </div>
            </div>
          )}
          {loading && (
            <div style={{ background:DS.panel, border:`1px solid ${DS.border}`, borderRadius:8,
              padding:24, textAlign:"center", marginTop:14 }}>
              <div style={{ fontSize:36, marginBottom:10, animation:"spin 2s linear infinite", display:"inline-block" }}>⚡</div>
              <div style={{ fontSize:15, fontWeight:700, color:DS.accent, marginBottom:6 }}>Claude IA analizando...</div>
              <div style={{ fontSize:12, color:DS.muted }}>{progress}</div>
              <div style={{ height:3, background:DS.border, borderRadius:2, overflow:"hidden", marginTop:14 }}>
                <div style={{ height:"100%", background:`linear-gradient(90deg,${DS.accent},${DS.blue})`,
                  borderRadius:2, animation:"scan 1.5s ease-in-out infinite" }} />
              </div>
            </div>
          )}
          {error && <div style={{ marginTop:12 }}><IaAlert msg={error} type="err" /></div>}
        </div>
      )}

      {resultado && (
        <div style={{ marginTop:0 }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
            background:DS.panel, border:`1px solid ${DS.green}44`, borderRadius:8,
            padding:"10px 14px", marginBottom:14 }}>
            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
              <span style={{ color:DS.green, fontSize:16 }}>✓</span>
              <span style={{ fontWeight:700 }}>Análisis completado</span>
              <IaTag color={DS.green}>IA ELECTROCAD</IaTag>
            </div>
            <div style={{ display:"flex", gap:8 }}>
              <button onClick={()=>alert("PDF generado")} style={{ padding:"7px 14px", background:DS.accent,
                color:"#000", border:"none", borderRadius:5, cursor:"pointer", fontFamily:DS.font, fontSize:12, fontWeight:700 }}>📄 PDF</button>
              <button onClick={()=>alert("Enviando WhatsApp...")} style={{ padding:"7px 14px",
                background:"rgba(34,197,94,0.15)", color:DS.green, border:`1px solid ${DS.green}44`,
                borderRadius:5, cursor:"pointer", fontFamily:DS.font, fontSize:12, fontWeight:700 }}>💬 WA</button>
              <button onClick={reset} style={{ padding:"7px 14px", background:"transparent",
                border:`1px solid ${DS.border}`, color:DS.muted, borderRadius:5, cursor:"pointer",
                fontFamily:DS.font, fontSize:12 }}>↺ Nueva</button>
            </div>
          </div>
          {modo==="ambiente" ? <ResultadoAmbiente data={resultado} imagen={preview} />
                             : <ResultadoPlano data={resultado} imagen={preview} />}
        </div>
      )}
    </div>
  );
}

function PlanoVirtual({ notify }) {
  const [elementos, setElementos] = useState([]);
  const [selected, setSelected] = useState(null);
  const [dragging, setDragging] = useState(null);
  const [dragOffset, setDragOffset] = useState({ x:0,y:0 });
  const [tool, setTool] = useState(null);
  const canvasRef = useRef(null);

  const handleCanvasClick = useCallback(e => {
    if (!tool) return;
    const rect = canvasRef.current.getBoundingClientRect();
    const el = ELEMENTOS_PLANO.find(el=>el.id===tool);
    const newEl = { ...el, x:e.clientX-rect.left-el.w/2, y:e.clientY-rect.top-el.h/2, uid:Date.now() };
    setElementos(prev=>[...prev,newEl]);
    notify(`${el.label} colocado`, "ok");
  }, [tool, notify]);

  const handleMouseDown = useCallback((e, uid) => {
    e.stopPropagation();
    const el = elementos.find(el=>el.uid===uid);
    setDragging(uid); setSelected(uid);
    setDragOffset({ x:e.clientX-el.x, y:e.clientY-el.y });
  }, [elementos]);

  const handleMouseMove = useCallback(e => {
    if (!dragging) return;
    const rect = canvasRef.current.getBoundingClientRect();
    setElementos(prev=>prev.map(el=>el.uid===dragging?{...el,x:e.clientX-rect.left-dragOffset.x,y:e.clientY-rect.top-dragOffset.y}:el));
  }, [dragging, dragOffset]);

  const conteo = ELEMENTOS_PLANO.map(t=>({...t,cantidad:elementos.filter(el=>el.id===t.id).length})).filter(t=>t.cantidad>0);
  const exceso = elementos.filter(el=>el.id==="toma").length > 8;

  return (
    <div style={{ display:"flex", gap:14, height:"calc(100vh - 110px)" }}>
      <div className="card" style={{ width:105, flexShrink:0, overflowY:"auto", padding:10 }}>
        <div className="card-title" style={{ marginBottom:8 }}>HERRAM.</div>
        {ELEMENTOS_PLANO.map(el => (
          <div key={el.id} className={`toolbar-el ${tool===el.id?"selected":""}`} onClick={()=>setTool(tool===el.id?null:el.id)}>
            <span className="toolbar-el-icon" style={{ color:el.color }}>{el.icon}</span>
            <span className="toolbar-el-label">{el.label}</span>
          </div>
        ))}
        <div className="section-sep" />
        <button className="btn btn-ghost" style={{ width:"100%",fontSize:11,marginBottom:6 }} onClick={()=>{setElementos(p=>p.filter(el=>el.uid!==selected));setSelected(null);}}>🗑 Borrar</button>
        <button className="btn btn-danger" style={{ width:"100%",fontSize:11 }} onClick={()=>{setElementos([]);setSelected(null);}}>✕ Limpiar</button>
      </div>
      <div style={{ flex:1, display:"flex", flexDirection:"column", gap:10 }}>
        {exceso && <div className="alert alert-warn" style={{ margin:0 }}>⚠ <strong>EXCESO DE BOCAS:</strong> Más de 8 tomacorrientes. Verificar distribución AEA 90364.</div>}
        <div className="canvas-wrap" style={{ flex:1 }} ref={canvasRef} onClick={handleCanvasClick} onMouseMove={handleMouseMove} onMouseUp={()=>setDragging(null)}>
          <div className="canvas-grid" />
          {elementos.map(el => (
            <div key={el.uid} className="element-placed" style={{ left:el.x,top:el.y,zIndex:selected===el.uid?10:1 }} onMouseDown={e=>handleMouseDown(e,el.uid)}>
              <div className="element-icon" style={{ width:el.w,height:el.h,background:`${el.color}18`,borderColor:selected===el.uid?DS.accent:el.color,color:el.color }}>{el.icon}</div>
              <span className="element-label">{el.label}</span>
            </div>
          ))}
          {tool && <div style={{ position:"absolute",bottom:12,left:"50%",transform:"translateX(-50%)",background:"rgba(0,0,0,0.7)",padding:"5px 14px",borderRadius:20,fontSize:11,color:DS.accent,pointerEvents:"none" }}>Clic → {ELEMENTOS_PLANO.find(e=>e.id===tool)?.label}</div>}
        </div>
      </div>
      <div style={{ width:190, flexShrink:0, display:"flex", flexDirection:"column", gap:12 }}>
        <div className="card">
          <div className="card-title">CONTEO</div>
          {conteo.length===0?<div style={{ color:DS.muted,fontSize:12 }}>Sin elementos</div>:conteo.map(t=>(
            <div key={t.id} style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8 }}>
              <span style={{ fontSize:12,color:t.color }}>{t.icon} {t.label}</span>
              <span style={{ fontFamily:DS.mono,color:DS.accent,fontWeight:700 }}>{t.cantidad}</span>
            </div>
          ))}
          <div className="section-sep" />
          <div style={{ fontSize:12,color:DS.muted }}>Total: <strong style={{ color:DS.text }}>{elementos.length}</strong></div>
        </div>
      </div>
    </div>
  );
}

function Calculos({ notify }) {
  const [tab, setTab] = useState("caida");
  const [caida, setCaida] = useState({ corriente:20, distancia:50, seccion:"2.5", tension:220 });
  const [caidaRes, setCaidaRes] = useState(null);
  const [dim, setDim] = useState({ potencia:2000, tension:220, fp:1, temp:30 });
  const [dimRes, setDimRes] = useState(null);

  const calcCaida = () => {
    const cv = (2*0.0172*parseFloat(caida.distancia)*parseFloat(caida.corriente))/parseFloat(caida.seccion);
    const pct = (cv/parseFloat(caida.tension))*100;
    setCaidaRes({ caida_v:cv.toFixed(2), pct:pct.toFixed(2), ok:pct<=3 });
    notify(pct<=3?"✓ Caída dentro del límite AEA":"⚠ Caída excede 3% — aumentar sección", pct<=3?"ok":"warn");
  };
  const calcDim = () => {
    const I = parseFloat(dim.potencia)/(parseFloat(dim.tension)*parseFloat(dim.fp));
    const ft = dim.temp>40?0.71:dim.temp>30?0.87:1;
    const Iadj = I/ft;
    const cable = CABLES.find(c=>c.amp_max>=Iadj*1.25)||CABLES[CABLES.length-1];
    const termica = TERMICAS.find(t=>t>=Iadj)||100;
    setDimRes({ I:I.toFixed(1), Iadj:Iadj.toFixed(1), cable, termica });
    notify(`Cable ${cable.seccion} — Térmica ${termica}A`, "ok");
  };

  return (
    <div>
      <div className="tabs">
        {[{id:"caida",label:"Caída de Tensión"},{id:"dimension",label:"Dimensionado de Cable"},{id:"referencia",label:"Tabla de Referencia"}].map(t => (
          <div key={t.id} className={`tab ${tab===t.id?"active":""}`} onClick={()=>setTab(t.id)}>{t.label}</div>
        ))}
      </div>
      {tab==="caida" && (
        <div className="grid-2">
          <div className="card">
            <div className="card-title">DATOS DEL CIRCUITO</div>
            <div className="form-row">
              <div><label>CORRIENTE (A)</label><input type="number" value={caida.corriente} onChange={e=>setCaida(p=>({...p,corriente:e.target.value}))} /></div>
              <div><label>DISTANCIA (m)</label><input type="number" value={caida.distancia} onChange={e=>setCaida(p=>({...p,distancia:e.target.value}))} /></div>
            </div>
            <div className="form-row">
              <div><label>SECCIÓN CABLE</label>
                <select value={caida.seccion} onChange={e=>setCaida(p=>({...p,seccion:e.target.value}))}>
                  {CABLES.map(c=><option key={c.seccion} value={parseFloat(c.seccion)}>{c.seccion}</option>)}
                </select>
              </div>
              <div><label>TENSIÓN</label>
                <select value={caida.tension} onChange={e=>setCaida(p=>({...p,tension:e.target.value}))}>
                  <option value={220}>220 V</option><option value={380}>380 V</option>
                </select>
              </div>
            </div>
            <button className="btn btn-primary" style={{ width:"100%",justifyContent:"center" }} onClick={calcCaida}>∑ Calcular</button>
          </div>
          <div className="card">
            <div className="card-title">RESULTADO</div>
            {!caidaRes?<div style={{ color:DS.muted,fontSize:13 }}>Completá los datos y calculá.</div>:(
              <>
                <div style={{ marginBottom:14 }}>
                  <div style={{ fontSize:11,color:DS.muted,marginBottom:4 }}>CAÍDA DE TENSIÓN</div>
                  <div style={{ fontFamily:DS.mono,fontSize:32,color:DS.accent,fontWeight:700 }}>{caidaRes.caida_v} V</div>
                </div>
                <div style={{ marginBottom:14 }}>
                  <div style={{ fontSize:11,color:DS.muted,marginBottom:4 }}>PORCENTAJE</div>
                  <div style={{ fontFamily:DS.mono,fontSize:32,color:caidaRes.ok?DS.green:DS.red,fontWeight:700 }}>{caidaRes.pct}%</div>
                </div>
                <div className={`alert ${caidaRes.ok?"alert-ok":"alert-err"}`}>
                  {caidaRes.ok?"✓ Dentro del límite AEA (máx. 3%)":"✕ SUPERA límite — Aumentar sección de cable"}
                </div>
              </>
            )}
          </div>
        </div>
      )}
      {tab==="dimension" && (
        <div className="grid-2">
          <div className="card">

                <select value={dim.tension} onChange={e=>setDim(p=>({...p,tension:e.target.value}))}>

                </select>

            <div className="form-row">
              <div><label>FACTOR DE POTENCIA</label><input type="number" step="0.05" min="0.5" max="1" value={dim.fp} onChange={e=>setDim(p=>({...p,fp:e.target.value}))} /></div>

                <div style={{ background:"rgba(43,143,232,0.1)",border:"1px solid rgba(43,143,232,0.3)",color:DS.blue,padding:"10px 14px",borderRadius:6,marginTop:8 }}>⚡ TÉRMICA: <strong>{dimRes.termica} A</strong></div>
              </>
            )}
          </div>
        </div>
      )}
      {tab==="referencia" && (
        <div className="card">
          <div className="card-title">TABLA COMPLETA — AEA 90364</div>
          <table className="table">
            <thead><tr><th>SECCIÓN</th><th>AMP. MÁX.</th><th>USO TÍPICO</th><th>TÉRMICA</th></tr></thead>
            <tbody>{CABLES.map((c,i) => (
              <tr key={i}>
                <td style={{ fontFamily:DS.mono,color:DS.accent,fontWeight:700 }}>{c.seccion}</td>

  const [form, setForm] = useState({ consumo:500, hsp:5.5, eficiencia:80, tension:24 });

function AuthScreen({ onLogin, notify }) {
  const [mode, setMode] = useState("login"); // login | register
  const [form, setForm] = useState({ nombre:"", email:"", password:"", confirm:"", provincia:"Buenos Aires", matricula:"", cuit:"" });
  const [loading, setLoading] = useState(false);
  const [showPass, setShowPass] = useState(false);

  const upd = (k,v) => setForm(p=>({...p,[k]:v}));

  const handleLogin = () => {
    setLoading(true);
    setTimeout(() => {
      const db = loadDB();
      const user = db.users.find(u => u.email===form.email && u.password===form.password);
      if (!user) { notify("Email o contraseña incorrectos","err"); setLoading(false); return; }
      if (user.estado==="suspendido") { notify("⚠ Tu cuenta está suspendida. Contactá al administrador.","err"); setLoading(false); return; }
      // Update last access
      user.ultimoAcceso = new Date().toISOString().split("T")[0];
      saveDB(db);
      notify(`Bienvenido, ${user.nombre.split(" ")[0]}!`,"ok");
      setLoading(false);
      onLogin(user);
    }, 700);
  };

  const handleRegister = () => {
    if (!form.nombre || !form.email || !form.password) { notify("Completá todos los campos obligatorios","warn"); return; }
    if (form.password !== form.confirm) { notify("Las contraseñas no coinciden","err"); return; }
    if (form.password.length < 6) { notify("La contraseña debe tener al menos 6 caracteres","warn"); return; }
    setLoading(true);
    setTimeout(() => {
      const db = loadDB();
      if (db.users.find(u=>u.email===form.email)) { notify("Ya existe una cuenta con ese email","err"); setLoading(false); return; }
      const newUser = {
        id: "u"+Date.now(),
        nombre: form.nombre,
        email: form.email,
        password: form.password,
        role: "user",
        plan: "free",
        licenseKey: "—",
        estado: "activo",
        provincia: form.provincia,
        matricula: form.matricula,
        cuit: form.cuit,
        fechaAlta: new Date().toISOString().split("T")[0],
        vencimiento: "—",
        proyectos: 0,
        calculos: 0,
        presupuestos: 0,
        ultimoAcceso: new Date().toISOString().split("T")[0],
      };
      db.users.push(newUser);
      db.pagos.push({ id:"p"+Date.now(), userId:newUser.id, nombre:newUser.nombre, monto:0, plan:"Free", fecha:newUser.fechaAlta, estado:"free", metodo:"—" });
      saveDB(db);
      notify("¡Cuenta creada! Ya podés ingresar con tu email y contraseña.","ok");
      setLoading(false);
      setMode("login");
      setForm(p=>({...p,password:"",confirm:""}));
    }, 800);
  };

  return (

      <div style={{ width:440,maxWidth:"100%",position:"relative",zIndex:1 }}>
        {/* Logo */}
        <div style={{ textAlign:"center",marginBottom:28 }}>
          <div style={{ width:56,height:56,background:DS.accent,borderRadius:12,display:"flex",
            alignItems:"center",justifyContent:"center",fontSize:26,fontWeight:900,color:"#000",
            margin:"0 auto 14px",boxShadow:`0 0 30px ${DS.accent}44` }}>⚡</div>
          <div style={{ fontSize:24,fontWeight:700,letterSpacing:1,color:DS.text }}>ElectroCAD PRO</div>

              <div key={t.id} onClick={()=>setMode(t.id)} style={{ flex:1,padding:"13px",textAlign:"center",
                cursor:"pointer",fontSize:13,fontWeight:700,letterSpacing:0.5,transition:"all 0.2s",
                borderBottom:`2px solid ${mode===t.id?DS.accent:"transparent"}`,
                color:mode===t.id?DS.accent:DS.muted,background:mode===t.id?"rgba(245,166,35,0.06)":"transparent" }}>
                {t.label}
              </div>

          </div>

          <div style={{ padding:24 }}>
            {mode==="login" && (

  const [modalPago, setModalPago] = useState(null);
  const [busqueda, setBusqueda] = useState("");
  const [formUser, setFormUser] = useState({});

  const refresh = () => { const d = loadDB(); setDb({...d}); };
  const persist = (newDb) => { saveDB(newDb); setDb({...newDb}); };

  // Stats
  const totalUsers = db.users.filter(u=>u.role!=="admin").length;
  const premium = db.users.filter(u=>u.plan==="premium"&&u.estado==="activo").length;
  const free = db.users.filter(u=>u.plan==="free").length;
  const suspendidos = db.users.filter(u=>u.estado==="suspendido").length;
  const facturadoTotal = db.pagos.filter(p=>p.estado==="cobrado").reduce((s,p)=>s+p.monto,0);

  const usuariosFiltrados = db.users.filter(u=>u.role!=="admin"&&(
    u.nombre.toLowerCase().includes(busqueda.toLowerCase())||
    u.email.toLowerCase().includes(busqueda.toLowerCase())||
    u.provincia.toLowerCase().includes(busqueda.toLowerCase())
  ));

  // Acciones sobre usuario
  const accion = (userId, accion) => {
    const newDb = {...db, users:[...db.users]};
    const u = newDb.users.find(u=>u.id===userId);
    if (!u) return;
    if (accion==="suspender") { u.estado="suspendido"; notify(`${u.nombre} suspendido`,"warn"); }
    if (accion==="activar")   { u.estado="activo";     notify(`${u.nombre} activado`,"ok");    }
    if (accion==="premium") {
      u.plan="premium"; u.estado="activo";
      u.licenseKey=genKey();
      u.vencimiento=new Date(Date.now()+365*24*3600*1000).toISOString().split("T")[0];
      newDb.pagos.push({ id:"p"+Date.now(), userId:u.id, nombre:u.nombre, monto:db.config.precioAnual, plan:"Premium Anual", fecha:new Date().toISOString().split("T")[0], estado:"cobrado", metodo:"Manual Admin" });
      notify(`${u.nombre} → Premium activado. Clave: ${u.licenseKey}`,"ok");
    }
    if (accion==="free") { u.plan="free"; u.licenseKey="—"; u.vencimiento="—"; notify(`${u.nombre} → Plan Free`,"info"); }
    if (accion==="eliminar") {
      newDb.users = newDb.users.filter(x=>x.id!==userId);
      newDb.pagos = newDb.pagos.filter(x=>x.userId!==userId);
      notify(`Usuario eliminado`,"warn");
    }
    if (accion==="nuevaclave") { u.licenseKey=genKey(); notify(`Nueva clave: ${u.licenseKey}`,"ok"); }
    persist(newDb);
  };

  // Crear usuario desde admin
  const crearUsuario = () => {
    const { nombre,email,password,plan,provincia,matricula,cuit } = formUser;
    if (!nombre||!email||!password) { notify("Completá nombre, email y contraseña","warn"); return; }
    const newDb = {...db,users:[...db.users]};
    if (newDb.users.find(u=>u.email===email)) { notify("Ya existe ese email","err"); return; }
    const key = plan==="premium"?genKey():"—";
    const newUser = {
      id:"u"+Date.now(), nombre, email, password, role:"user", plan:plan||"free",
      licenseKey:key, estado:"activo", provincia:provincia||"Buenos Aires",
      matricula:matricula||"—", cuit:cuit||"—",
      fechaAlta:new Date().toISOString().split("T")[0],
      vencimiento:plan==="premium"?new Date(Date.now()+365*24*3600*1000).toISOString().split("T")[0]:"—",
      proyectos:0,calculos:0,presupuestos:0,
      ultimoAcceso:new Date().toISOString().split("T")[0],
    };
    newDb.users.push(newUser);
    if (plan==="premium") newDb.pagos.push({ id:"p"+Date.now(),userId:newUser.id,nombre,monto:db.config.precioAnual,plan:"Premium Anual",fecha:newUser.fechaAlta,estado:"cobrado",metodo:"Manual Admin" });
    persist(newDb);
    notify(`Usuario ${nombre} creado${plan==="premium"?` — Clave: ${key}`:""}`, "ok");
    setModalUsuario(null);
    setFormUser({});
  };

  const planTag = (p,estado) => {
    if (estado==="suspendido") return <Tag color={DS.red}>SUSPENDIDO</Tag>;
    if (p==="premium") return <Tag color={DS.accent}>PREMIUM</Tag>;
    return <Tag color={DS.muted}>FREE</Tag>;
  };

  const tabs = [
    {id:"dashboard",label:"Dashboard",icon:"⬡"},
    {id:"usuarios",  label:"Usuarios",  icon:"◈"},
    {id:"pagos",     label:"Pagos",     icon:"₿"},
    {id:"config",    label:"Config.",   icon:"⚙"},
  ];

  return (
    <div style={{ display:"flex",height:"100vh",fontFamily:DS.font,background:DS.bg,color:DS.text }}>
      {/* Sidebar admin */}
      <div style={{ width:200,background:DS.panel,borderRight:`1px solid ${DS.border}`,display:"flex",flexDirection:"column",flexShrink:0 }}>
        <div style={{ padding:"14px 16px",borderBottom:`1px solid ${DS.border}` }}>
          <div style={{ display:"flex",alignItems:"center",gap:10 }}>
            <div style={{ width:30,height:30,borderRadius:6,background:DS.purple,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,color:"#fff",fontWeight:700,flexShrink:0 }}>A</div>
            <div>
              <div style={{ fontSize:13,fontWeight:700,letterSpacing:0.5 }}>ElectroCAD</div>
              <div style={{ fontSize:8,color:DS.muted,fontFamily:DS.mono,letterSpacing:2 }}>ADMIN PANEL</div>
            </div>
          </div>
        </div>
        <nav style={{ flex:1,padding:"8px 0" }}>
          {tabs.map(t=>(
            <div key={t.id} onClick={()=>setTab(t.id)} style={{ display:"flex",alignItems:"center",gap:10,
              padding:"10px 14px",cursor:"pointer",borderLeft:`3px solid ${tab===t.id?DS.purple:"transparent"}`,
              background:tab===t.id?"rgba(168,85,247,0.1)":"transparent",color:tab===t.id?DS.purple:DS.muted,
              fontSize:13,fontWeight:600,letterSpacing:0.5,transition:"all 0.15s" }}>
              <span style={{ fontSize:16 }}>{t.icon}</span>{t.label}
            </div>
          ))}
        </nav>
        <div style={{ padding:12,borderTop:`1px solid ${DS.border}` }}>
          <div style={{ fontSize:11,color:DS.muted,marginBottom:6 }}>Admin: <strong style={{ color:DS.text }}>Sistema</strong></div>
          <button onClick={onLogout} style={{ width:"100%",padding:"7px",background:"rgba(239,68,68,0.1)",
            border:"1px solid rgba(239,68,68,0.3)",color:DS.red,borderRadius:5,cursor:"pointer",
            fontFamily:DS.font,fontSize:12,fontWeight:600 }}>↩ Cerrar Sesión</button>
        </div>
      </div>

      {/* Main admin */}
      <div style={{ flex:1,display:"flex",flexDirection:"column",overflow:"hidden" }}>
        {/* Topbar */}
        <div style={{ height:50,background:DS.panel,borderBottom:`1px solid ${DS.border}`,
          display:"flex",alignItems:"center",padding:"0 20px",gap:12 }}>
          <Tag color={DS.purple}>PANEL ADMINISTRADOR</Tag>
          <span style={{ fontSize:14,fontWeight:700,letterSpacing:0.5 }}>{tabs.find(t=>t.id===tab)?.label.toUpperCase()}</span>
          <div style={{ marginLeft:"auto",display:"flex",gap:10,alignItems:"center" }}>
            <span style={{ fontSize:11,color:DS.muted,fontFamily:DS.mono }}>{new Date().toLocaleDateString("es-AR")}</span>
            <button onClick={refresh} style={{ padding:"5px 10px",background:DS.surface,border:`1px solid ${DS.border}`,
              color:DS.muted,borderRadius:5,cursor:"pointer",fontFamily:DS.font,fontSize:11 }}>↺ Actualizar</button>
          </div>
        </div>

        <div style={{ flex:1,overflowY:"auto",padding:20 }}>

          {/* ── DASHBOARD ADMIN ── */}
          {tab==="dashboard" && (
            <div>
              <div style={{ display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:14,marginBottom:20 }}>
                <StatCard label="USUARIOS TOTALES" value={totalUsers} icon="◈" />
                <StatCard label="PLAN PREMIUM" value={premium} color={DS.accent} icon="⚡" />
                <StatCard label="PLAN FREE" value={free} color={DS.muted} icon="○" />
                <StatCard label="SUSPENDIDOS" value={suspendidos} color={DS.red} icon="✕" />
                <StatCard label="FACTURADO TOTAL" value={`$${facturadoTotal.toLocaleString("es-AR")}`} color={DS.green} icon="₿" />
              </div>

              {/* Últimos usuarios */}
              <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:14 }}>
                <div style={{ background:DS.panel,border:`1px solid ${DS.border}`,borderRadius:8,padding:16 }}>
                  <div style={{ fontSize:10,fontWeight:700,letterSpacing:2,color:DS.muted,marginBottom:12 }}>ÚLTIMOS USUARIOS REGISTRADOS</div>
                  <table style={{ width:"100%",borderCollapse:"collapse",fontSize:12 }}>
                    <thead><tr>{["NOMBRE","PLAN","FECHA ALTA","ESTADO"].map(h=><th key={h} style={{ padding:"5px 8px",textAlign:"left",fontSize:9,letterSpacing:1.5,color:DS.muted,borderBottom:`1px solid ${DS.border}`,fontWeight:600 }}>{h}</th>)}</tr></thead>
                    <tbody>{db.users.filter(u=>u.role!=="admin").slice(-5).reverse().map(u=>(
                      <tr key={u.id} style={{ borderBottom:`1px solid ${DS.border}22` }}>
                        <td style={{ padding:"7px 8px",fontWeight:600 }}>{u.nombre}</td>
                        <td style={{ padding:"7px 8px" }}>{planTag(u.plan,u.estado)}</td>
                        <td style={{ padding:"7px 8px",fontFamily:DS.mono,fontSize:11,color:DS.muted }}>{u.fechaAlta}</td>
                        <td style={{ padding:"7px 8px" }}>{u.estado==="activo"?<Tag color={DS.green}>ACTIVO</Tag>:<Tag color={DS.red}>SUSP.</Tag>}</td>
                      </tr>
                    ))}</tbody>
                  </table>
                </div>
                <div style={{ background:DS.panel,border:`1px solid ${DS.border}`,borderRadius:8,padding:16 }}>
                  <div style={{ fontSize:10,fontWeight:700,letterSpacing:2,color:DS.muted,marginBottom:12 }}>ÚLTIMOS PAGOS</div>
                  <table style={{ width:"100%",borderCollapse:"collapse",fontSize:12 }}>
                    <thead><tr>{["USUARIO","PLAN","MONTO","ESTADO"].map(h=><th key={h} style={{ padding:"5px 8px",textAlign:"left",fontSize:9,letterSpacing:1.5,color:DS.muted,borderBottom:`1px solid ${DS.border}`,fontWeight:600 }}>{h}</th>)}</tr></thead>
                    <tbody>{db.pagos.slice(-5).reverse().map(p=>(
                      <tr key={p.id} style={{ borderBottom:`1px solid ${DS.border}22` }}>
                        <td style={{ padding:"7px 8px",fontWeight:600 }}>{p.nombre.split(" ")[0]}</td>
                        <td style={{ padding:"7px 8px",fontSize:11 }}>{p.plan}</td>
                        <td style={{ padding:"7px 8px",fontFamily:DS.mono,color:DS.accent }}>{p.monto?`$${p.monto.toLocaleString("es-AR")}`:"—"}</td>
                        <td style={{ padding:"7px 8px" }}>{p.estado==="cobrado"?<Tag color={DS.green}>COBRADO</Tag>:p.estado==="vencido"?<Tag color={DS.red}>VENCIDO</Tag>:<Tag color={DS.muted}>FREE</Tag>}</td>
                      </tr>
                    ))}</tbody>
                  </table>
                </div>
              </div>

              {/* Acciones rápidas */}
              <div style={{ marginTop:14,background:DS.panel,border:`1px solid ${DS.border}`,borderRadius:8,padding:16 }}>
                <div style={{ fontSize:10,fontWeight:700,letterSpacing:2,color:DS.muted,marginBottom:12 }}>ACCIONES RÁPIDAS</div>
                <div style={{ display:"flex",gap:10,flexWrap:"wrap" }}>
                  <button onClick={()=>setTab("usuarios")} style={{ padding:"9px 18px",background:DS.accent,color:"#000",border:"none",borderRadius:6,cursor:"pointer",fontFamily:DS.font,fontSize:12,fontWeight:700 }}>◈ Gestionar Usuarios</button>
                  <button onClick={()=>{setModalUsuario("nuevo");setFormUser({plan:"premium"});}} style={{ padding:"9px 18px",background:"rgba(168,85,247,0.15)",color:DS.purple,border:`1px solid ${DS.purple}44`,borderRadius:6,cursor:"pointer",fontFamily:DS.font,fontSize:12,fontWeight:700 }}>+ Nuevo Usuario</button>
                  <button onClick={()=>setTab("pagos")} style={{ padding:"9px 18px",background:"rgba(34,197,94,0.1)",color:DS.green,border:`1px solid ${DS.green}44`,borderRadius:6,cursor:"pointer",fontFamily:DS.font,fontSize:12,fontWeight:700 }}>₿ Ver Pagos</button>
                  <button onClick={()=>setTab("config")} style={{ padding:"9px 18px",background:DS.surface,color:DS.muted,border:`1px solid ${DS.border}`,borderRadius:6,cursor:"pointer",fontFamily:DS.font,fontSize:12,fontWeight:700 }}>⚙ Configuración</button>
                </div>
              </div>
            </div>
          )}

          {/* ── USUARIOS ── */}
          {tab==="usuarios" && (
            <div>
              <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14 }}>
                <div style={{ display:"flex",gap:10,alignItems:"center" }}>
                  <input value={busqueda} onChange={e=>setBusqueda(e.target.value)} placeholder="Buscar por nombre, email o provincia..."
                    style={{ background:DS.surface,border:`1px solid ${DS.border}`,color:DS.text,padding:"8px 12px",borderRadius:6,fontFamily:DS.font,fontSize:13,outline:"none",width:300 }} />
                  <Tag color={DS.muted}>{usuariosFiltrados.length} resultados</Tag>
                </div>
                <button onClick={()=>{setModalUsuario("nuevo");setFormUser({plan:"premium"});}}
                  style={{ padding:"9px 18px",background:DS.accent,color:"#000",border:"none",borderRadius:6,cursor:"pointer",fontFamily:DS.font,fontSize:13,fontWeight:700 }}>
                  + Nuevo Usuario
                </button>
              </div>

              <div style={{ background:DS.panel,border:`1px solid ${DS.border}`,borderRadius:8 }}>
                <table style={{ width:"100%",borderCollapse:"collapse",fontSize:13 }}>
                  <thead>
                    <tr>{["NOMBRE / EMAIL","MATRÍCULA","PROVINCIA","PLAN","ÚLTIMO ACCESO","CLAVE PREMIUM","ACCIONES"].map(h=>(
                      <th key={h} style={{ padding:"8px 12px",textAlign:"left",fontSize:9,letterSpacing:1.5,color:DS.muted,borderBottom:`1px solid ${DS.border}`,fontWeight:600 }}>{h}</th>
                    ))}</tr>
                  </thead>
                  <tbody>
                    {usuariosFiltrados.map(u=>(
                      <tr key={u.id} style={{ borderBottom:`1px solid ${DS.border}22` }}>
                        <td style={{ padding:"10px 12px" }}>
                          <div style={{ fontWeight:700 }}>{u.nombre}</div>
                          <div style={{ fontSize:11,color:DS.muted,fontFamily:DS.mono }}>{u.email}</div>
                        </td>
                        <td style={{ padding:"10px 12px",fontFamily:DS.mono,fontSize:12 }}>{u.matricula}</td>
                        <td style={{ padding:"10px 12px",fontSize:12,color:DS.muted }}>{u.provincia}</td>
                        <td style={{ padding:"10px 12px" }}>{planTag(u.plan,u.estado)}</td>
                        <td style={{ padding:"10px 12px",fontFamily:DS.mono,fontSize:11,color:DS.muted }}>{u.ultimoAcceso}</td>
                        <td style={{ padding:"10px 12px",fontFamily:DS.mono,fontSize:10,color:u.licenseKey!=="—"?DS.accent:DS.muted }}>{u.licenseKey}</td>
                        <td style={{ padding:"10px 12px" }}>
                          <div style={{ display:"flex",gap:4,flexWrap:"wrap" }}>
                            {u.estado==="activo"
                              ? <button onClick={()=>accion(u.id,"suspender")} style={{ padding:"4px 8px",background:"rgba(239,68,68,0.1)",color:DS.red,border:"1px solid rgba(239,68,68,0.3)",borderRadius:4,cursor:"pointer",fontFamily:DS.font,fontSize:10,fontWeight:600 }}>Suspender</button>
                              : <button onClick={()=>accion(u.id,"activar")} style={{ padding:"4px 8px",background:"rgba(34,197,94,0.1)",color:DS.green,border:"1px solid rgba(34,197,94,0.3)",borderRadius:4,cursor:"pointer",fontFamily:DS.font,fontSize:10,fontWeight:600 }}>Activar</button>
                            }
                            {u.plan!=="premium"
                              ? <button onClick={()=>accion(u.id,"premium")} style={{ padding:"4px 8px",background:"rgba(245,166,35,0.1)",color:DS.accent,border:"1px solid rgba(245,166,35,0.3)",borderRadius:4,cursor:"pointer",fontFamily:DS.font,fontSize:10,fontWeight:600 }}>→ Premium</button>
                              : <button onClick={()=>accion(u.id,"free")} style={{ padding:"4px 8px",background:"rgba(100,116,139,0.1)",color:DS.muted,border:`1px solid ${DS.border}`,borderRadius:4,cursor:"pointer",fontFamily:DS.font,fontSize:10,fontWeight:600 }}>→ Free</button>
                            }
                            {u.plan==="premium" && <button onClick={()=>accion(u.id,"nuevaclave")} style={{ padding:"4px 8px",background:"rgba(168,85,247,0.1)",color:DS.purple,border:"1px solid rgba(168,85,247,0.3)",borderRadius:4,cursor:"pointer",fontFamily:DS.font,fontSize:10,fontWeight:600 }}>↺ Clave</button>}
                            <button onClick={()=>{if(window.confirm(`¿Eliminar a ${u.nombre}?`)) accion(u.id,"eliminar");}} style={{ padding:"4px 8px",background:"rgba(239,68,68,0.05)",color:DS.red,border:"1px solid rgba(239,68,68,0.2)",borderRadius:4,cursor:"pointer",fontFamily:DS.font,fontSize:10,fontWeight:600 }}>🗑</button>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* ── PAGOS ── */}
          {tab==="pagos" && (
            <div>
              <div style={{ display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14,marginBottom:18 }}>
                <StatCard label="TOTAL COBRADO" value={`$${facturadoTotal.toLocaleString("es-AR")}`} color={DS.green} icon="₿" />
                <StatCard label="CLIENTES PREMIUM" value={premium} color={DS.accent} icon="⚡" />
                <StatCard label="PAGOS VENCIDOS" value={db.pagos.filter(p=>p.estado==="vencido").length} color={DS.red} icon="⚠" />
                <StatCard label="PRECIO ANUAL" value={`$${db.config.precioAnual?.toLocaleString("es-AR")}`} color={DS.blue} icon="◎" />
              </div>
              <div style={{ background:DS.panel,border:`1px solid ${DS.border}`,borderRadius:8 }}>
                <div style={{ padding:"12px 16px",borderBottom:`1px solid ${DS.border}`,display:"flex",justifyContent:"space-between",alignItems:"center" }}>
                  <div style={{ fontSize:10,fontWeight:700,letterSpacing:2,color:DS.muted }}>HISTORIAL DE PAGOS</div>
                </div>
                <table style={{ width:"100%",borderCollapse:"collapse",fontSize:13 }}>
                  <thead><tr>{["USUARIO","PLAN","MONTO","MÉTODO","FECHA","ESTADO"].map(h=><th key={h} style={{ padding:"8px 12px",textAlign:"left",fontSize:9,letterSpacing:1.5,color:DS.muted,borderBottom:`1px solid ${DS.border}`,fontWeight:600 }}>{h}</th>)}</tr></thead>
                  <tbody>{db.pagos.map(p=>(
                    <tr key={p.id} style={{ borderBottom:`1px solid ${DS.border}22` }}>
                      <td style={{ padding:"9px 12px",fontWeight:600 }}>{p.nombre}</td>
                      <td style={{ padding:"9px 12px",fontSize:12 }}>{p.plan}</td>
                      <td style={{ padding:"9px 12px",fontFamily:DS.mono,color:DS.accent }}>{p.monto?`ARS ${p.monto.toLocaleString("es-AR")}`:"—"}</td>
                      <td style={{ padding:"9px 12px",fontSize:12,color:DS.muted }}>{p.metodo}</td>
                      <td style={{ padding:"9px 12px",fontFamily:DS.mono,fontSize:11,color:DS.muted }}>{p.fecha}</td>
                      <td style={{ padding:"9px 12px" }}>{p.estado==="cobrado"?<Tag color={DS.green}>COBRADO</Tag>:p.estado==="vencido"?<Tag color={DS.red}>VENCIDO</Tag>:<Tag color={DS.muted}>FREE</Tag>}</td>
                    </tr>
                  ))}</tbody>
                </table>
              </div>
            </div>
          )}

          {/* ── CONFIG ── */}
          {tab==="config" && (
            <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:16 }}>
              <div style={{ background:DS.panel,border:`1px solid ${DS.border}`,borderRadius:8,padding:18 }}>
                <div style={{ fontSize:10,fontWeight:700,letterSpacing:2,color:DS.muted,marginBottom:14 }}>PRECIOS DE SUSCRIPCIÓN</div>
                {[
                  {label:"PRECIO MENSUAL (ARS)",key:"precioMensual"},
                  {label:"PRECIO ANUAL (ARS)",key:"precioAnual"},
                ].map(f=>(
                  <div key={f.key} style={{ marginBottom:12 }}>
                    <label style={{ fontSize:10,color:DS.muted,letterSpacing:1,fontWeight:600,display:"block",marginBottom:5 }}>{f.label}</label>
                    <input type="number" defaultValue={db.config[f.key]}
                      onChange={e=>{const d=loadDB();d.config[f.key]=+e.target.value;saveDB(d);}}
                      style={{ width:"100%",background:DS.surface,border:`1px solid ${DS.border}`,color:DS.text,padding:"8px 12px",borderRadius:6,fontFamily:DS.mono,fontSize:14,outline:"none" }} />
                  </div>
                ))}
                <button onClick={()=>notify("Precios actualizados","ok")}
                  style={{ padding:"9px 18px",background:DS.accent,color:"#000",border:"none",borderRadius:6,cursor:"pointer",fontFamily:DS.font,fontSize:13,fontWeight:700 }}>
                  Guardar Precios
                </button>
              </div>
              <div style={{ background:DS.panel,border:`1px solid ${DS.border}`,borderRadius:8,padding:18 }}>
                <div style={{ fontSize:10,fontWeight:700,letterSpacing:2,color:DS.muted,marginBottom:14 }}>FUNCIONES POR PLAN</div>
                <div style={{ marginBottom:14 }}>
                  <div style={{ display:"flex",alignItems:"center",gap:8,marginBottom:8 }}><Tag color={DS.muted}>FREE</Tag></div>
                  {["Dashboard","Cálculos","Mi Perfil"].map(f=><div key={f} style={{ fontSize:12,color:DS.muted,padding:"3px 0" }}>✓ {f}</div>)}
                  {["Plano Virtual","IA","Simulador DIN","Solar","Corrientes Débiles","Presupuesto"].map(f=><div key={f} style={{ fontSize:12,color:DS.red,padding:"3px 0" }}>✕ {f}</div>)}
                </div>
                <div style={{ height:1,background:DS.border,margin:"12px 0" }} />
                <div>
                  <div style={{ display:"flex",alignItems:"center",gap:8,marginBottom:8 }}><Tag color={DS.accent}>PREMIUM</Tag></div>
                  {["Dashboard","Plano Virtual","Análisis IA","Simulador DIN","Cálculos","Solar FV","Corrientes Débiles","Presupuesto","Mi Perfil"].map(f=><div key={f} style={{ fontSize:12,color:DS.green,padding:"3px 0" }}>✓ {f}</div>)}
                </div>
              </div>
              <div style={{ background:DS.panel,border:`1px solid ${DS.border}`,borderRadius:8,padding:18,gridColumn:"1/-1" }}>
                <div style={{ fontSize:10,fontWeight:700,letterSpacing:2,color:DS.muted,marginBottom:14 }}>RESET DE BASE DE DATOS</div>
                <div style={{ fontSize:13,color:DS.muted,marginBottom:12 }}>Esto eliminará todos los usuarios y pagos y restaurará la base de datos al estado inicial de demo.</div>
                <button onClick={()=>{if(window.confirm("¿Resetear toda la DB? Esta acción no se puede deshacer.")){localStorage.removeItem(DB_KEY);setDb(loadDB());notify("DB reseteada","warn");}}}

// APP PRINCIPAL CON AUTH

function ElectroCADAuth() {
  const [user, setUser] = useState(null);
  const [notifs, setNotifs] = useState([]);
  const [activeModule, setActiveModule] = useState("dashboard");
  const [sidebarOpen, setSidebarOpen] = useState(true);

  const notify = useCallback((msg, type="info") => {
    const id = Date.now();
    setNotifs(n=>[...n,{id,msg,type}]);
    setTimeout(()=>setNotifs(n=>n.filter(x=>x.id!==id)), 3500);
  }, []);

  const handleLogin = useCallback((u) => {
    setUser(u);
    setActiveModule(u.role==="admin"?"dashboard":"dashboard");
  }, []);

  const handleLogout = () => {
    setUser(null);
    setActiveModule("dashboard");
    notify("Sesión cerrada","info");
  };

  const canAccess = (modId) => {
    if (!user) return false;
    if (user.role==="admin") return true;
    return PLAN_FEATURES[user.plan]?.modules.includes(modId);
  };

  const modules = [
    { id:"dashboard",   label:"Dashboard",         icon:"⬡" },
    { id:"plano",       label:"Plano Virtual",      icon:"⊞", premium:true },
    { id:"ia",          label:"Análisis IA",        icon:"🤖", premium:true },
    { id:"tablero",     label:"Simulador DIN",      icon:"⚡", premium:true },
    { id:"calculos",    label:"Cálculos",           icon:"∑" },
    { id:"solar",       label:"Solar FV",           icon:"☀", premium:true },
    { id:"corrientes",  label:"Corrientes Débiles", icon:"◉", premium:true },
    { id:"presupuesto", label:"Presupuesto",        icon:"₿", premium:true },
    { id:"perfil",      label:"Mi Perfil",          icon:"◈" },
  ];

  // Pantalla de login
  if (!user) return (
    <>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        body{background:${DS.bg};color:${DS.text};font-family:${DS.font};}
        @keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
        @keyframes modalIn{from{transform:scale(0.95);opacity:0}to{transform:scale(1);opacity:1}}
        input:focus,select:focus{border-color:${DS.accent}!important;box-shadow:0 0 0 2px ${DS.accent}22;}
      `}</style>
      <AuthScreen onLogin={handleLogin} notify={notify} />
      <Notifs items={notifs} />
    </>
  );

  // Panel admin
  if (user.role==="admin") return (
    <>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        body{background:${DS.bg};color:${DS.text};font-family:${DS.font};overflow:hidden;}
        ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:${DS.surface}}::-webkit-scrollbar-thumb{background:${DS.border};border-radius:2px}
        @keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
        @keyframes modalIn{from{transform:scale(0.95);opacity:0}to{transform:scale(1);opacity:1}}
        input:focus,select:focus{border-color:${DS.accent}!important;}
      `}</style>
      <AdminPanel adminUser={user} onLogout={handleLogout} notify={notify} />
      <Notifs items={notifs} />

  );

  // App de usuario (free o premium)

function CalcBasic({ notify }) {
  const [c, setC] = useState({ corriente:20, distancia:50, seccion:"2.5", tension:220 });
  const [res, setRes] = useState(null);
  const calcular = () => {
    const cv = (2*0.0172*parseFloat(c.distancia)*parseFloat(c.corriente))/parseFloat(c.seccion);
    const pct = (cv/parseFloat(c.tension))*100;
    setRes({ cv:cv.toFixed(2), pct:pct.toFixed(2), ok:pct<=3 });
    notify(pct<=3?"✓ Caída dentro del límite AEA":"⚠ Caída supera 3%", pct<=3?"ok":"warn");
  };
  return (
    <div>
      <div style={{ background:DS.panel,border:`1px solid ${DS.border}`,borderRadius:8,padding:18,marginBottom:14 }}>
        <div style={{ fontSize:10,fontWeight:700,letterSpacing:2,color:DS.muted,marginBottom:14 }}>CALCULADORA DE CAÍDA DE TENSIÓN</div>
        <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12 }}>
          <div><label>CORRIENTE (A)</label><input type="number" value={c.corriente} onChange={e=>setC(p=>({...p,corriente:e.target.value}))} /></div>
          <div><label>DISTANCIA (m)</label><input type="number" value={c.distancia} onChange={e=>setC(p=>({...p,distancia:e.target.value}))} /></div>
          <div><label>SECCIÓN (mm²)</label>
            <select value={c.seccion} onChange={e=>setC(p=>({...p,seccion:e.target.value}))}>
              {CABLES.map(x=><option key={x.seccion} value={parseFloat(x.seccion)}>{x.seccion}</option>)}
            </select>
          </div>
          <div><label>TENSIÓN</label>
            <select value={c.tension} onChange={e=>setC(p=>({...p,tension:e.target.value}))}>
              <option value={220}>220 V</option><option value={380}>380 V</option>
            </select>
          </div>
        </div>
        <button onClick={calcular} style={{ width:"100%",padding:11,borderRadius:6,border:"none",
          background:`linear-gradient(135deg,${DS.accent},${DS.accentDim})`,color:"#000",
          fontFamily:DS.font,fontSize:14,fontWeight:700,cursor:"pointer" }}>∑ Calcular</button>
        {res && (
          <div style={{ marginTop:14,display:"grid",gridTemplateColumns:"1fr 1fr",gap:12 }}>
            <div style={{ background:DS.surface,borderRadius:6,padding:"12px 14px" }}>

        .tag-red{background:rgba(239,68,68,0.15);color:${DS.red};}
        .tag-blue{background:rgba(43,143,232,0.15);color:${DS.blue};}
        input,select,textarea{background:${DS.surface};border:1px solid ${DS.border};color:${DS.text};padding:7px 11px;border-radius:5px;font-family:${DS.font};font-size:13px;outline:none;width:100%;}
        input:focus,select:focus{border-color:${DS.accent};}
        label{font-size:10px;color:${DS.muted};letter-spacing:1px;font-weight:600;display:block;margin-bottom:4px;}
        .form-row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px;}
        .alert{padding:10px 14px;border-radius:6px;font-size:13px;display:flex;align-items:flex-start;gap:8px;margin-bottom:10px;}
        .alert-warn{background:rgba(234,179,8,0.1);border:1px solid rgba(234,179,8,0.3);color:${DS.yellow};}
        .alert-err{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:${DS.red};}
        .alert-ok{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);color:${DS.green};}
        .canvas-wrap{position:relative;background:${DS.surface};border:1px solid ${DS.border};border-radius:8px;overflow:hidden;cursor:crosshair;}
        .canvas-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(30,38,51,0.6) 1px,transparent 1px),linear-gradient(90deg,rgba(30,38,51,0.6) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;}
        .element-placed{position:absolute;display:flex;flex-direction:column;align-items:center;cursor:grab;user-select:none;}
        .element-icon{display:flex;align-items:center;justify-content:center;border-radius:6px;border:2px solid;font-size:17px;transition:transform 0.1s;}
        .element-icon:hover{transform:scale(1.1);}
        .element-label{font-size:8px;color:${DS.muted};margin-top:2px;white-space:nowrap;font-family:${DS.mono};}
        .toolbar-el{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 6px;border-radius:6px;cursor:pointer;border:1px solid transparent;transition:all 0.15s;}
        .toolbar-el:hover{background:rgba(245,166,35,0.08);border-color:${DS.border};}
        .toolbar-el.selected{background:rgba(245,166,35,0.15);border-color:${DS.accent};}
        .toolbar-el-icon{font-size:20px;}.toolbar-el-label{font-size:8px;color:${DS.muted};text-align:center;}
        .din-rail{background:linear-gradient(180deg,#1a1a2e,#16213e);border:2px solid #2a2a4a;border-radius:8px;padding:14px;min-height:180px;}
        .din-track{height:7px;background:linear-gradient(180deg,#888,#555,#888);border-radius:2px;margin:7px 0;}
        .breakers-row{display:flex;flex-wrap:wrap;gap:4px;padding:7px 0;}
        .breaker{width:42px;min-height:78px;border-radius:4px;border:2px solid;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 3px;cursor:pointer;transition:all 0.15s;position:relative;}
        .breaker.on{background:linear-gradient(180deg,#1a3a2a,#0d2a1a);border-color:#22C55E;}
        .breaker.off{background:linear-gradient(180deg,#3a1a1a,#2a0d0d);border-color:#EF4444;}
        .breaker.trip{background:linear-gradient(180deg,#3a2a0a,#2a1a00);border-color:#F5A623;animation:tripAnim 0.5s ease 3;}
        .breaker-amp{font-size:10px;font-weight:700;font-family:${DS.mono};color:${DS.text};}
        .breaker-toggle{width:14px;height:26px;border-radius:3px;border:1px solid rgba(255,255,255,0.2);}
        .breaker.on .breaker-toggle{background:${DS.green};}.breaker.off .breaker-toggle{background:${DS.red};}.breaker.trip .breaker-toggle{background:${DS.accent};}
        .breaker-label{font-size:7px;color:${DS.muted};text-align:center;line-height:1.2;}
        .progress-bar{height:6px;background:${DS.border};border-radius:3px;overflow:hidden;}
        .progress-fill{height:100%;border-radius:3px;transition:width 0.5s ease;}
        .tabs{display:flex;gap:0;border-bottom:1px solid ${DS.border};margin-bottom:18px;}
        .tab{padding:9px 16px;font-size:12px;font-weight:600;letter-spacing:0.5px;cursor:pointer;border-bottom:2px solid transparent;color:${DS.muted};transition:all 0.15s;}
        .tab.active{color:${DS.accent};border-bottom-color:${DS.accent};}.tab:hover{color:${DS.text};}
        .section-sep{height:1px;background:${DS.border};margin:16px 0;}
        .budget-item{display:flex;align-items:center;gap:10px;padding:9px;border-radius:6px;border:1px solid ${DS.border};background:${DS.surface};margin-bottom:7px;}
        .premium-badge{background:linear-gradient(135deg,#F5A623,#C47D0E);color:#000;font-size:9px;font-weight:700;padding:3px 8px;border-radius:3px;letter-spacing:2px;}
      `}</style>

      <div className="app">
        <div className="sidebar">
          <div className="sidebar-logo">
            <div className="logo-mark">⚡</div>
            {sidebarOpen && <div><div className="logo-text">ElectroCAD</div><div className="logo-sub">PRO v2.0</div></div>}
          </div>
          <nav style={{ flex:1, padding:"6px 0", overflowY:"auto" }}>
            {modules.map(m => {
              const accessible = canAccess(m.id);
              return (
                <div key={m.id}
                  className={`nav-item ${activeModule===m.id?"active":""} ${!accessible?"locked":""}`}
                  onClick={()=>setActiveModule(m.id)}>
                  <span className="nav-icon">{m.icon}</span>
                  {sidebarOpen && (
                    <>
                      <span className="nav-label">{m.label}</span>
                      {m.premium && !accessible && <span className="nav-pro">PRO</span>}
                    </>
                  )}
                </div>
              );
            })}
          </nav>
          <div className="sidebar-footer">
            {sidebarOpen && (
              <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center" }}>
                <span className="premium-badge">{planInfo.label}</span>
                <span style={{ fontSize:9,color:DS.muted }}>ARG 2025</span>
              </div>
            )}
          </div>
        </div>

        <div className="main">
          <div className="topbar">
            <button className="btn btn-ghost" onClick={()=>setSidebarOpen(s=>!s)} style={{ padding:"5px 9px",fontSize:16 }}>☰</button>
            <div className="status-dot" />
            <span className="topbar-title">{modLabel.toUpperCase()}</span>
            <span className="topbar-badge">{activeModule==="ia"?"CLAUDE AI VISION · AEA 90364":"REGLAMENTACIÓN AEA 90364"}</span>
            <div style={{ marginLeft:"auto",display:"flex",gap:10,alignItems:"center" }}>
              <span style={{ fontSize:11,color:DS.muted }}>{user.nombre}</span>
              <div onClick={()=>setActiveModule("perfil")} style={{ width:30,height:30,borderRadius:"50%",
                background:user.plan==="premium"?DS.accent:DS.muted,display:"flex",alignItems:"center",
                justifyContent:"center",fontWeight:700,color:"#000",fontSize:13,cursor:"pointer" }}>
                {user.nombre.charAt(0)}
              </div>
              <button onClick={onLogout} style={{ padding:"5px 10px",background:"rgba(239,68,68,0.1)",
                border:"1px solid rgba(239,68,68,0.3)",color:DS.red,borderRadius:5,cursor:"pointer",
                fontFamily:DS.font,fontSize:11,fontWeight:600 }}>↩ Salir</button>
            </div>
          </div>
          <div className="content">
            {showUpgrade
              ? <UpgradeWall moduleName={modLabel} onBack={()=>setActiveModule("dashboard")} />
              : <FullAppModules activeModule={activeModule} user={user} notify={notify} setModule={setActiveModule} />
            }
          </div>
        </div>
      </div>
    </>
  );
}

// ════════════════════════════════════════════════════════════
// ENTRY POINT — EXPORT DEFAULT
// ════════════════════════════════════════════════════════════
export default function ElectroCADFinal() {
  const [user, setUser] = useState(null);
  const [notifs, setNotifs] = useState([]);

  const notify = useCallback((msg, type="info") => {
    const id = Date.now();
    setNotifs(n=>[...n,{id,msg,type}]);
    setTimeout(()=>setNotifs(n=>n.filter(x=>x.id!==id)), 3500);
  }, []);

  const handleLogin = useCallback((u) => setUser(u), []);

  const handleLogout = () => {
    setUser(null);
    notify("Sesión cerrada correctamente","info");
  };

  return (
    <>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        body{background:${DS.bg};color:${DS.text};font-family:${DS.font};}
        @keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
        @keyframes modalIn{from{transform:scale(0.95);opacity:0}to{transform:scale(1);opacity:1}}
        input:focus,select:focus{border-color:${DS.accent}!important;}
      `}</style>

      {!user && <AuthScreen onLogin={handleLogin} notify={notify} />}
      {user && user.role==="admin" && <AdminPanel adminUser={user} onLogout={handleLogout} notify={notify} />}
      {user && user.role!=="admin" && <FullAppShell user={user} onLogout={handleLogout} notify={notify} />}

      {/* NOTIFICACIONES GLOBALES */}
      <div style={{ position:"fixed",bottom:18,right:18,display:"flex",flexDirection:"column",gap:7,zIndex:9999 }}>
        {notifs.map(n=>(
          <div key={n.id} style={{ padding:"10px 14px",borderRadius:6,fontSize:13,fontWeight:600,
            background:DS.panel,border:`1px solid ${DS.border}`,boxShadow:"0 4px 20px rgba(0,0,0,0.4)",
            maxWidth:300,animation:"slideIn 0.25s ease",
            borderLeft:`3px solid ${n.type==="ok"?DS.green:n.type==="warn"?DS.yellow:n.type==="err"?DS.red:DS.blue}` }}>
            {n.msg}
          </div>
        ))}
      </div>
    </>
  );
}


// Mount app
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(ElectroCADFinal));
</script>
</body>
